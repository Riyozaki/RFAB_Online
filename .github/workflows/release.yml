name: Windows development build (artifacts only)

on:
  push:
    branches: ['arena/**', 'main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: ${{ runner.os }}-xmake-mt-${{ hashFiles('**/xmake.lua') }}
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.1.0
      # Node is required by build step [6/8]: the CEF UI is compiled from
      # Code/skyrim_ui instead of being copied from a committed bundle.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable pnpm
        run: corepack enable
        shell: powershell
      - name: Build, test & package development artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        # No -VersionTag: the tag comes from the VERSION file (single source of
        # truth). Publishing only happens for refs/tags/v*, the script enforces it.
        run: .\Tools\rfab\Build-CloudRelease.ps1 -SkipPublish

      # These are diagnostic development artifacts, NOT the approved complete gameplay candidate.
      # Publication remains disabled regardless of branch or tag.
      - name: Upload unready development build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RFAB_Online-development-${{ github.sha }}
          path: |
            release_artifacts/*.zip
            release_artifacts/SHA256SUMS.txt
            release_artifacts/RELEASE_NOTES.md
            release_artifacts/diagnostics/**
            build/ci-diagnostics/*.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
