<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful illustrated white pelican rides a blue bicycle along a sunny seaside road.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7bd5f5"/>
      <stop offset="1" stop-color="#e5f9fb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20b6d1"/>
      <stop offset="1" stop-color="#53d6e3"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffdf7b"/>
      <stop offset="1" stop-color="#ee9d42"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1478ba"/>
      <stop offset="1" stop-color="#0b3d7b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dx="0" dy="9" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="roadDashes" width="110" height="20" patternUnits="userSpaceOnUse">
      <rect width="60" height="12" rx="6" fill="#fff6cf"/>
    </pattern>
  </defs>

  <!-- coastal backdrop -->
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="1000" cy="135" r="66" fill="#ffe277"/>
  <g fill="#fff" opacity=".8">
    <path d="M96 142c22-28 57-25 75 2 25-27 65-21 78 11H77c3-7 9-11 19-13z"/>
    <path d="M352 85c16-20 40-18 54 1 19-20 49-15 59 9H333c3-6 9-9 19-10z"/>
    <path d="M790 227c15-19 38-17 50 2 17-19 46-14 56 9H773c3-6 8-9 17-11z"/>
  </g>
  <path d="M0 442 C170 398 250 469 413 434S690 402 868 440s234-26 332-3V635H0z" fill="url(#sea)"/>
  <g fill="none" stroke="#ddfbff" stroke-linecap="round" opacity=".78">
    <path d="M38 497c45-22 91-22 135 0" stroke-width="8"/>
    <path d="M240 546c42-19 85-19 126 0" stroke-width="7"/>
    <path d="M718 510c56-25 113-24 167 1" stroke-width="8"/>
    <path d="M965 567c41-18 82-18 122 0" stroke-width="7"/>
  </g>
  <path d="M0 586c196-43 330 4 503-13 204-20 354 30 697-10v337H0z" fill="#e8d597"/>
  <g fill="#d1bc78" opacity=".7">
    <ellipse cx="112" cy="695" rx="7" ry="3"/><ellipse cx="195" cy="769" rx="11" ry="4"/><ellipse cx="874" cy="721" rx="8" ry="3"/>
    <ellipse cx="1076" cy="668" rx="11" ry="4"/><ellipse cx="583" cy="814" rx="10" ry="3"/>
  </g>
  <path d="M0 702c211-37 452-28 666 2 201 28 365 26 534-1v197H0z" fill="#5c6870"/>
  <path d="M0 759c211-31 429-20 656 7 214 25 376 26 544-6" fill="none" stroke="url(#roadDashes)" stroke-width="16"/>
  <path d="M0 709c211-37 452-28 666 2 201 28 365 26 534-1" fill="none" stroke="#46545d" stroke-width="7"/>

  <!-- reeds at shore -->
  <g stroke="#34785e" stroke-linecap="round">
    <path d="M105 620c4-69-11-108-30-137M105 620c2-75 25-111 49-149M105 620c-19-52-49-75-76-91" stroke-width="8"/>
    <path d="M1108 628c-4-69 12-110 35-148M1108 628c-4-75-27-111-51-149M1108 628c19-52 49-75 76-92" stroke-width="8"/>
  </g>
  <g fill="#704c33"><rect x="69" y="455" width="12" height="49" rx="6" transform="rotate(-10 75 480)"/><rect x="146" y="449" width="12" height="50" rx="6" transform="rotate(18 152 475)"/><rect x="1049" y="453" width="12" height="49" rx="6" transform="rotate(-18 1055 478)"/><rect x="1141" y="456" width="12" height="50" rx="6" transform="rotate(13 1147 480)"/></g>

  <!-- bicycle -->
  <g filter="url(#shadow)">
    <!-- wheels -->
    <g fill="#f8faf7" stroke="#263842">
      <circle cx="389" cy="695" r="116" stroke-width="18"/>
      <circle cx="821" cy="695" r="116" stroke-width="18"/>
      <circle cx="389" cy="695" r="9" fill="#263842" stroke="none"/>
      <circle cx="821" cy="695" r="9" fill="#263842" stroke="none"/>
      <g stroke="#95a5aa" stroke-width="3">
        <path d="M389 579v232M273 695h232M307 613l164 164M471 613L307 777"/>
        <path d="M821 579v232M705 695h232M739 613l164 164M903 613L739 777"/>
      </g>
    </g>
    <!-- frame -->
    <g fill="none" stroke="url(#frame)" stroke-width="17" stroke-linejoin="round" stroke-linecap="round">
      <path d="M389 695 L507 496 L629 695 Z"/>
      <path d="M507 496 L703 506 L629 695"/>
      <path d="M703 506 L821 695"/>
      <path d="M507 496 L479 462"/>
      <path d="M703 506 L734 439 L779 419"/>
    </g>
    <!-- seat and handlebar -->
    <path d="M444 449q37-16 74 2l-7 16h-69z" fill="#243b46"/>
    <path d="M779 419q24-24 48-7" fill="none" stroke="#263842" stroke-width="12" stroke-linecap="round"/>
    <!-- crank & pedals -->
    <circle cx="629" cy="695" r="27" fill="#f3bf3e" stroke="#263842" stroke-width="8"/>
    <path d="M629 695l48 22m-63-27l-43-21" stroke="#263842" stroke-width="8" stroke-linecap="round"/>
    <path d="M670 716h28m-104-52h-27" stroke="#263842" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- pelican rider -->
  <g filter="url(#shadow)">
    <!-- tail / body -->
    <path d="M447 466c-84 3-142 64-116 129 17 42 86 57 157 18 45-24 82-75 77-117-4-36-46-33-118-29z" fill="#f6f3e9" stroke="#284653" stroke-width="8"/>
    <path d="M351 528c50-4 116-48 150-61-5 59-41 106-98 120-39 10-65-11-52-59z" fill="#dce9e6"/>
    <!-- wing -->
    <path d="M474 489c-15 18-14 111 22 148 25 26 59 10 55-26-4-34-25-85-51-124-9-14-18-16-26 2z" fill="#cadedd" stroke="#284653" stroke-width="8"/>
    <path d="M490 508c4 39 14 80 40 111M502 500c16 32 32 62 42 92" fill="none" stroke="#91bfc0" stroke-width="7" stroke-linecap="round"/>
    <!-- neck -->
    <path d="M441 465c-22-50-11-142 33-176 41-32 101-17 115 34 8 29-3 61-34 77-34 18-35 52-30 93z" fill="#f8f7ed" stroke="#284653" stroke-width="8"/>
    <!-- head -->
    <path d="M461 301c6-67 71-105 126-75 47 25 55 89 24 127-38 46-135 17-150-52z" fill="#f8f7ed" stroke="#284653" stroke-width="8"/>
    <!-- crown feathers -->
    <path d="M486 272c-4-39 10-65 34-84-6 27 1 43 16 57 2-31 18-54 39-67-6 33 5 50 22 66" fill="none" stroke="#f8f7ed" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M486 272c-4-39 10-65 34-84-6 27 1 43 16 57 2-31 18-54 39-67-6 33 5 50 22 66" fill="none" stroke="#284653" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- bill and pouch -->
    <path d="M566 296c77-28 178-19 211 9 21 18 3 41-29 52-57 21-115 7-178-17-23-9-23-35-4-44z" fill="url(#beak)" stroke="#284653" stroke-width="8"/>
    <path d="M580 334c51 14 112 21 168 2-20 55-91 77-148 54-23-10-31-34-20-56z" fill="#ef9d72" stroke="#284653" stroke-width="8"/>
    <path d="M596 349c48 16 95 17 132 5" fill="none" stroke="#cf735e" stroke-width="6" stroke-linecap="round"/>
    <!-- eye -->
    <circle cx="548" cy="270" r="16" fill="#fff" stroke="#284653" stroke-width="6"/>
    <circle cx="552" cy="272" r="7" fill="#263842"/>
    <circle cx="555" cy="268" r="2.5" fill="#fff"/>
    <!-- smile -->
    <path d="M576 294q12 14 28 1" fill="none" stroke="#284653" stroke-width="5" stroke-linecap="round"/>
    <!-- arms holding handlebars -->
    <path d="M500 481c52 1 123-22 212-57" fill="none" stroke="#f8f7ed" stroke-width="28" stroke-linecap="round"/>
    <path d="M500 481c52 1 123-22 212-57" fill="none" stroke="#284653" stroke-width="8" stroke-linecap="round"/>
    <path d="M703 426q12-21 31-8l13 12-15 15-15-12" fill="#f3bf8c" stroke="#284653" stroke-width="6" stroke-linejoin="round"/>
    <!-- legs -->
    <path d="M431 572c48 6 89 25 136 78" fill="none" stroke="#f8f7ed" stroke-width="30" stroke-linecap="round"/>
    <path d="M431 572c48 6 89 25 136 78" fill="none" stroke="#284653" stroke-width="8" stroke-linecap="round"/>
    <path d="M562 648l62 38" stroke="#f8f7ed" stroke-width="26" stroke-linecap="round"/>
    <path d="M562 648l62 38" stroke="#284653" stroke-width="8" stroke-linecap="round"/>
    <!-- webbed feet -->
    <path d="M614 684q30-7 53 13l-10 17-55-7zM557 642q-28-8-52 10l9 18 52-7z" fill="#f3bf8c" stroke="#284653" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- foreground flowers -->
  <g transform="translate(995 605)">
    <path d="M0 104C5 47 25 20 50 0M-14 108C-38 67-55 53-78 43M10 103C38 60 65 50 89 51" stroke="#3b805e" stroke-width="9" stroke-linecap="round"/>
    <g fill="#ff8e70" stroke="#b95551" stroke-width="3"><circle cx="50" cy="0" r="15"/><circle cx="-78" cy="43" r="13"/><circle cx="89" cy="51" r="13"/></g>
    <g fill="#ffd766"><circle cx="50" cy="0" r="5"/><circle cx="-78" cy="43" r="4"/><circle cx="89" cy="51" r="4"/></g>
  </g>
</svg>
