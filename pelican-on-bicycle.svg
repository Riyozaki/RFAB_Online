<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
  <title id="title">Пеликан на велосипеде</title>
  <desc id="desc">Весёлый белый пеликан в жёлтом шлеме и бирюзовом шарфе едет на красном велосипеде с корзинкой, в которой лежит рыба.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ED8F8"/>
      <stop offset="55%" stop-color="#C9EFFE"/>
      <stop offset="100%" stop-color="#FFF3D6"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3EC6D8"/>
      <stop offset="100%" stop-color="#7BE0D4"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFE98A"/>
      <stop offset="55%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#FFD93D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect x="0" y="0" width="900" height="640" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="788" cy="92" r="86" fill="url(#sunGlow)" opacity="0.55"/>
  <circle cx="788" cy="92" r="44" fill="#FFD93D" stroke="#20303A" stroke-width="5"/>
  <g stroke="#FFC93D" stroke-width="7" stroke-linecap="round">
    <line x1="788" y1="18" x2="788" y2="32"/>
    <line x1="726" y1="40" x2="736" y2="50"/>
    <line x1="850" y1="40" x2="840" y2="50"/>
    <line x1="714" y1="92" x2="728" y2="92"/>
    <line x1="862" y1="92" x2="848" y2="92"/>
    <line x1="730" y1="148" x2="740" y2="138"/>
    <line x1="846" y1="148" x2="836" y2="138"/>
  </g>

  <!-- clouds -->
  <g fill="#FFFFFF" stroke="#20303A" stroke-width="4">
    <path d="M 78 108 a 30 24 0 0 1 22-28 a 38 30 0 0 1 70-8 a 28 22 0 0 1 34 20 a 24 18 0 0 1-12 24 L 92 118 a 22 16 0 0 1-14-10 Z"/>
    <path d="M 352 66 a 24 19 0 0 1 18-22 a 32 24 0 0 1 58-6 a 23 18 0 0 1 28 16 a 20 15 0 0 1-10 20 L 366 76 a 18 13 0 0 1-14-10 Z"/>
    <path d="M 600 176 a 20 15 0 0 1 15-18 a 26 20 0 0 1 47-5 a 19 14 0 0 1 23 13 a 16 12 0 0 1-8 16 L 612 184 a 15 11 0 0 1-12-8 Z" opacity="0.95"/>
  </g>

  <!-- distant birds -->
  <g fill="none" stroke="#20303A" stroke-width="3.5" stroke-linecap="round">
    <path d="M 240 140 q 10-10 20 0 q 10-10 20 0"/>
    <path d="M 300 168 q 8-8 16 0 q 8-8 16 0"/>
    <path d="M 150 190 q 8-8 16 0 q 8-8 16 0"/>
  </g>

  <!-- sea and dunes -->
  <path d="M 0 438 L 900 438 L 900 500 L 0 500 Z" fill="url(#sea)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <path d="M 40 462 q 22-10 44 0 q 22 10 44 0"/>
    <path d="M 700 458 q 22-10 44 0 q 22 10 44 0"/>
    <path d="M 770 482 q 18-8 36 0 q 18 8 36 0"/>
  </g>
  <path d="M 0 492 Q 180 452 360 488 T 900 484 L 900 640 L 0 640 Z" fill="#FFE3A3"/>
  <!-- road -->
  <path d="M 0 532 L 900 532 L 900 640 L 0 640 Z" fill="#5B6B7A"/>
  <path d="M 0 532 L 900 532" stroke="#20303A" stroke-width="5"/>
  <g fill="#FFF3D6">
    <rect x="20" y="584" width="74" height="10" rx="5"/>
    <rect x="150" y="584" width="74" height="10" rx="5"/>
    <rect x="280" y="584" width="74" height="10" rx="5"/>
    <rect x="410" y="584" width="74" height="10" rx="5"/>
    <rect x="540" y="584" width="74" height="10" rx="5"/>
    <rect x="670" y="584" width="74" height="10" rx="5"/>
    <rect x="800" y="584" width="74" height="10" rx="5"/>
  </g>
  <!-- grass tufts on sand -->
  <g fill="none" stroke="#2FA84F" stroke-width="4" stroke-linecap="round">
    <path d="M 60 532 q-4-16-12-20 M 62 532 q0-18 4-24 M 64 532 q5-14 14-18"/>
    <path d="M 820 530 q-4-16-12-20 M 822 530 q0-18 4-24 M 824 530 q5-14 14-18"/>
    <path d="M 730 534 q-3-12-10-15 M 732 534 q0-14 3-18 M 734 534 q4-10 11-13"/>
  </g>

  <!-- shadow under bike -->
  <ellipse cx="455" cy="572" rx="265" ry="17" fill="#20303A" opacity="0.18"/>

  <!-- speed lines -->
  <g stroke="#20303A" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <line x1="52" y1="300" x2="128" y2="300"/>
    <line x1="30" y1="340" x2="140" y2="340"/>
    <line x1="58" y1="380" x2="128" y2="380"/>
    <line x1="84" y1="262" x2="140" y2="262"/>
  </g>
  <!-- dust puffs behind rear wheel -->
  <g fill="#FFFFFF" stroke="#20303A" stroke-width="3.5" opacity="0.9">
    <circle cx="168" cy="538" r="13"/>
    <circle cx="146" cy="550" r="9"/>
    <circle cx="188" cy="552" r="8"/>
  </g>

  <!-- ================= BICYCLE (far parts) ================= -->
  <!-- wheels -->
  <g id="rear-wheel">
    <circle cx="285" cy="485" r="79" fill="#EAF9FF" fill-opacity="0.35" stroke="#20303A" stroke-width="11"/>
    <circle cx="285" cy="485" r="66" fill="none" stroke="#B9C8D3" stroke-width="4"/>
    <g stroke="#8FA6B5" stroke-width="3">
      <line x1="285" y1="485" x2="285" y2="419"/>
      <line x1="285" y1="485" x2="285" y2="551"/>
      <line x1="285" y1="485" x2="219" y2="485"/>
      <line x1="285" y1="485" x2="351" y2="485"/>
      <line x1="285" y1="485" x2="238" y2="438"/>
      <line x1="285" y1="485" x2="332" y2="438"/>
      <line x1="285" y1="485" x2="238" y2="532"/>
      <line x1="285" y1="485" x2="332" y2="532"/>
    </g>
    <circle cx="285" cy="485" r="10" fill="#5B6B7A" stroke="#20303A" stroke-width="4"/>
  </g>
  <g id="front-wheel">
    <circle cx="625" cy="485" r="79" fill="#EAF9FF" fill-opacity="0.35" stroke="#20303A" stroke-width="11"/>
    <circle cx="625" cy="485" r="66" fill="none" stroke="#B9C8D3" stroke-width="4"/>
    <g stroke="#8FA6B5" stroke-width="3">
      <line x1="625" y1="485" x2="625" y2="419"/>
      <line x1="625" y1="485" x2="625" y2="551"/>
      <line x1="625" y1="485" x2="559" y2="485"/>
      <line x1="625" y1="485" x2="691" y2="485"/>
      <line x1="625" y1="485" x2="578" y2="438"/>
      <line x1="625" y1="485" x2="672" y2="438"/>
      <line x1="625" y1="485" x2="578" y2="532"/>
      <line x1="625" y1="485" x2="672" y2="532"/>
    </g>
    <circle cx="625" cy="485" r="10" fill="#5B6B7A" stroke="#20303A" stroke-width="4"/>
  </g>

  <!-- far (left) leg of pelican, behind frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 398 332 L 382 412 L 406 462" stroke="#20303A" stroke-width="19"/>
    <path d="M 398 332 L 382 412 L 406 462" stroke="#E8710A" stroke-width="11"/>
  </g>
  <!-- far webbed foot on rear pedal -->
  <path d="M 406 458 L 382 476 L 398 478 L 392 486 L 412 484 L 410 492 L 428 478 L 422 460 Z"
        fill="#E8710A" stroke="#20303A" stroke-width="4" stroke-linejoin="round"/>

  <!-- chain -->
  <g stroke="#5B6B7A" stroke-width="4" fill="none">
    <line x1="292" y1="472" x2="428" y2="470"/>
    <line x1="292" y1="498" x2="428" y2="508"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#E94F37" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <line x1="285" y1="485" x2="435" y2="490"/>
    <line x1="285" y1="485" x2="380" y2="356"/>
    <line x1="435" y1="490" x2="378" y2="350"/>
    <line x1="435" y1="490" x2="592" y2="384"/>
    <line x1="384" y1="360" x2="584" y2="362"/>
    <line x1="592" y1="376" x2="625" y2="485"/>
  </g>
  <g fill="none" stroke="#20303A" stroke-width="2" opacity="0.18" stroke-linecap="round">
    <line x1="435" y1="486" x2="588" y2="382"/>
  </g>

  <!-- mudguards -->
  <path d="M 214 452 A 84 84 0 0 1 352 440" fill="none" stroke="#0EAAA6" stroke-width="8" stroke-linecap="round"/>
  <path d="M 556 448 A 84 84 0 0 1 696 444" fill="none" stroke="#0EAAA6" stroke-width="8" stroke-linecap="round"/>

  <!-- seat post + saddle -->
  <line x1="378" y1="352" x2="370" y2="328" stroke="#5B6B7A" stroke-width="8" stroke-linecap="round"/>
  <path d="M 330 330 Q 368 312 408 326 Q 412 338 396 340 L 344 342 Q 328 340 330 330 Z"
        fill="#7A4A2B" stroke="#20303A" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- stem + handlebar -->
  <line x1="586" y1="358" x2="574" y2="322" stroke="#5B6B7A" stroke-width="8" stroke-linecap="round"/>
  <path d="M 574 322 Q 596 304 612 316 Q 620 324 610 330" fill="none" stroke="#20303A" stroke-width="7" stroke-linecap="round"/>
  <circle cx="592" cy="306" r="8" fill="#FFD93D" stroke="#20303A" stroke-width="3.5"/>

  <!-- crank + pedals -->
  <circle cx="435" cy="490" r="23" fill="#D7E3EB" stroke="#20303A" stroke-width="4.5"/>
  <circle cx="435" cy="490" r="7" fill="#5B6B7A" stroke="#20303A" stroke-width="3"/>
  <line x1="435" y1="490" x2="464" y2="514" stroke="#20303A" stroke-width="7" stroke-linecap="round"/>
  <line x1="435" y1="490" x2="408" y2="468" stroke="#20303A" stroke-width="7" stroke-linecap="round"/>
  <rect x="444" y="510" width="42" height="10" rx="5" fill="#20303A"/>
  <rect x="388" y="460" width="42" height="10" rx="5" fill="#20303A"/>

  <!-- ================= PELICAN ================= -->
  <!-- tail feathers (black tips) -->
  <path d="M 286 252 L 222 222 L 246 262 L 212 262 L 248 288 L 224 312 L 272 312 Q 296 288 286 252 Z"
        fill="#20303A" stroke="#20303A" stroke-width="4" stroke-linejoin="round"/>

  <!-- scarf (behind neck, flying) -->
  <path d="M 498 188 Q 430 150 372 168 Q 338 178 318 162 Q 332 192 318 210 Q 366 236 420 218 Q 472 204 498 214 Z"
        fill="#0EAAA6" stroke="#20303A" stroke-width="4.5" stroke-linejoin="round"/>
  <g stroke="#20303A" stroke-width="3.5" stroke-linecap="round">
    <line x1="322" y1="168" x2="306" y2="162"/>
    <line x1="326" y1="186" x2="308" y2="186"/>
    <line x1="322" y1="204" x2="306" y2="212"/>
  </g>
  <path d="M 430 164 Q 424 192 434 220" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- neck (thick S, drawn as filled shape behind head, in front of body join) -->
  <path d="M 462 268
           Q 478 196 508 156
           Q 520 140 536 136
           L 566 152
           Q 552 166 542 196
           Q 528 238 524 272
           Q 494 292 462 268 Z"
        fill="#FFFFFF" stroke="#20303A" stroke-width="5" stroke-linejoin="round"/>

  <!-- body -->
  <path d="M 272 262
           Q 300 204 384 196
           Q 462 190 502 232
           Q 534 266 516 306
           Q 496 346 426 354
           Q 340 360 296 326
           Q 260 298 272 262 Z"
        fill="#FFFFFF" stroke="#20303A" stroke-width="5" stroke-linejoin="round"/>
  <!-- belly shading -->
  <path d="M 316 330 Q 400 354 478 326 Q 430 352 360 346 Q 330 342 316 330 Z" fill="#E8EEF2"/>

  <!-- folded wing on the back -->
  <path d="M 330 224
           Q 410 206 462 238
           Q 428 250 446 264
           Q 406 264 420 284
           Q 366 292 322 272
           Q 300 246 330 224 Z"
        fill="#E8EEF2" stroke="#20303A" stroke-width="4" stroke-linejoin="round"/>
  <g fill="none" stroke="#B9C8D3" stroke-width="3.5" stroke-linecap="round">
    <path d="M 336 244 Q 386 230 428 244"/>
    <path d="M 334 262 Q 378 252 414 262"/>
  </g>

  <!-- scarf wrap around neck -->
  <path d="M 488 176 Q 518 162 544 180 L 536 214 Q 508 200 482 208 Z"
        fill="#0EAAA6" stroke="#20303A" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M 494 182 Q 516 172 536 184" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- wing-arm reaching to handlebar -->
  <path d="M 472 252
           Q 540 272 578 310
           Q 590 322 582 332
           Q 574 340 556 332
           Q 512 310 462 290
           Q 452 264 472 252 Z"
        fill="#FFFFFF" stroke="#20303A" stroke-width="5" stroke-linejoin="round"/>
  <!-- feather fingers gripping the bar -->
  <g fill="#FFFFFF" stroke="#20303A" stroke-width="3.5">
    <ellipse cx="578" cy="316" rx="9" ry="6" transform="rotate(35 578 316)"/>
    <ellipse cx="584" cy="326" rx="9" ry="6" transform="rotate(35 584 326)"/>
  </g>

  <!-- near (right) leg -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 446 344 L 472 428 L 464 506" stroke="#20303A" stroke-width="20"/>
    <path d="M 446 344 L 472 428 L 464 506" stroke="#FF8A3D" stroke-width="12"/>
  </g>
  <!-- near webbed foot on front pedal -->
  <path d="M 464 500 L 438 520 L 456 521 L 450 531 L 472 528 L 470 538 L 490 520 L 483 500 Z"
        fill="#FF8A3D" stroke="#20303A" stroke-width="4" stroke-linejoin="round"/>

  <!-- ===== head ===== -->
  <!-- crest tuft at back of head -->
  <path d="M 528 96 L 506 76 L 516 104 L 496 98 L 514 118 Q 528 112 528 96 Z"
        fill="#FFFFFF" stroke="#20303A" stroke-width="4" stroke-linejoin="round"/>
  <!-- head -->
  <ellipse cx="556" cy="120" rx="42" ry="38" fill="#FFFFFF" stroke="#20303A" stroke-width="5"/>

  <!-- beak: pouch first (below), then upper beak -->
  <path d="M 580 132 Q 640 150 700 160 L 758 168 Q 716 206 656 200 Q 600 194 578 156 Z"
        fill="#FFB26B" stroke="#20303A" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- fish tail wiggling out of the pouch -->
  <path d="M 668 196 L 656 218 L 672 212 L 676 226 L 686 202 Z"
        fill="#3EC6D8" stroke="#20303A" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 582 104 L 766 154 Q 776 158 770 166 Q 764 174 748 170 L 584 138 Q 572 118 582 104 Z"
        fill="#FF8A3D" stroke="#20303A" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- beak nail (hook at tip) -->
  <path d="M 750 152 Q 772 158 768 170 Q 764 180 752 172 Q 746 160 750 152 Z" fill="#E94F37" stroke="#20303A" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- nostril line -->
  <path d="M 596 116 Q 670 134 740 152" fill="none" stroke="#E8710A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- helmet (drawn before the eye, brim stays above it) -->
  <path d="M 516 102 A 46 42 0 0 1 600 94 Q 604 104 596 106 L 526 110 Q 514 110 516 102 Z"
        fill="#FFC93D" stroke="#20303A" stroke-width="4.5" stroke-linejoin="round"/>
  <g stroke="#20303A" stroke-width="3.5" stroke-linecap="round">
    <line x1="544" y1="74" x2="546" y2="98"/>
    <line x1="568" y1="72" x2="568" y2="96"/>
    <line x1="588" y1="78" x2="586" y2="98"/>
  </g>
  <path d="M 592 104 Q 592 124 582 136" fill="none" stroke="#20303A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- eye -->
  <circle cx="558" cy="126" r="11" fill="#BDEBFF" stroke="#20303A" stroke-width="3"/>
  <circle cx="561" cy="127" r="6" fill="#20303A"/>
  <circle cx="563.5" cy="124.5" r="2" fill="#FFFFFF"/>
  <!-- happy cheek -->
  <ellipse cx="538" cy="144" rx="9" ry="6" fill="#FFC4A8"/>

  <!-- ================= FRONT BASKET with fish ================= -->
  <line x1="596" y1="368" x2="626" y2="378" stroke="#20303A" stroke-width="5" stroke-linecap="round"/>
  <!-- fish in basket -->
  <g stroke="#20303A" stroke-width="3.5" stroke-linejoin="round">
    <path d="M 640 352 Q 630 332 640 318 Q 652 332 650 352 Z" fill="#3EC6D8"/>
    <path d="M 640 318 L 632 304 L 644 310 L 652 302 L 652 320 Z" fill="#0EAAA6"/>
    <path d="M 668 356 Q 664 338 674 328 Q 682 342 680 356 Z" fill="#FF8A3D"/>
  </g>
  <!-- basket body -->
  <path d="M 612 356 L 694 356 L 682 420 Q 680 430 668 430 L 638 430 Q 626 430 624 420 Z"
        fill="#C68B4E" stroke="#20303A" stroke-width="4.5" stroke-linejoin="round"/>
  <g stroke="#8A5A2B" stroke-width="3.5">
    <line x1="616" y1="378" x2="690" y2="378"/>
    <line x1="620" y1="400" x2="686" y2="400"/>
    <line x1="636" y1="356" x2="640" y2="430"/>
    <line x1="658" y1="356" x2="658" y2="430"/>
    <line x1="678" y1="356" x2="674" y2="430"/>
  </g>
  <rect x="608" y="348" width="90" height="14" rx="7" fill="#8A5A2B" stroke="#20303A" stroke-width="4"/>

</svg>
