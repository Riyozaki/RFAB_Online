; RFAB Online — клиентские настройки
; Положить по пути: <Skyrim SE>\Data\SKSE\Plugins\RFABOnline.ini
; Ключи регистронезависимы, значения 0/1/true/false/yes/no.

[Save]
; Закрывать соединение с сервером, если игрок загрузил сохранение во время
; игры в мультиплеере. Загрузка сохранения «поверх» живой сессии — главная
; причина рассинхронов и вылетов: сервер продолжает слать состояние мира,
; которого на клиенте больше нет.
bStopSessionOnLoad = 1

; Вести индекс сохранений, созданных во время сессии: рядом с сохранениями
; появляется RFABOnline_saves_index.jsonl, где для каждого файла записано,
; в какой сессии он сделан (сервер, персонаж, sessionId, время).
bIndexSaves = 1

; Показывать сообщения в игре (HUD) о загрузке/сохранении.
bNotifyInGame = 1

; Как часто проверять папку сохранений, мс (1000..60000).
uPollIntervalMs = 5000

[World]
; (зарезервировано) настройки мира, читаются сервером
