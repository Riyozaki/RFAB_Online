<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4f2"/>
      <stop offset="1" stop-color="#d9f0ff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7dde3"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#f0892a"/>
    </linearGradient>
    <g id="spokes" stroke="#9aa3ab" stroke-width="2">
      <line x1="-74" y1="0" x2="74" y2="0"/>
      <line x1="0" y1="-74" x2="0" y2="74"/>
      <line x1="-52" y1="-52" x2="52" y2="52"/>
      <line x1="-52" y1="52" x2="52" y2="-52"/>
      <line x1="-68" y1="-28" x2="68" y2="28"/>
      <line x1="-68" y1="28" x2="68" y2="-28"/>
      <line x1="-28" y1="-68" x2="28" y2="68"/>
      <line x1="-28" y1="68" x2="28" y2="-68"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="95" r="48" fill="#ffe27a"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="140" cy="90" rx="60" ry="20"/>
    <ellipse cx="180" cy="75" rx="40" ry="22"/>
    <ellipse cx="520" cy="60" rx="50" ry="16"/>
  </g>
  <rect y="500" width="800" height="100" fill="#8fcf6b"/>
  <rect y="496" width="800" height="8" fill="#6bb04a"/>
  <ellipse cx="405" cy="503" rx="260" ry="10" fill="#000" opacity="0.15"/>

  <!-- Far leg (behind bike) -->
  <g stroke="#d9741c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="355,285 398,335 362,392"/>
  </g>
  <path d="M350,392 L378,388 L372,400 Z" fill="#d9741c"/>

  <!-- Wheels -->
  <g>
    <circle cx="250" cy="420" r="80" fill="none" stroke="#2b2f33" stroke-width="10"/>
    <circle cx="250" cy="420" r="73" fill="none" stroke="#c7ccd1" stroke-width="3"/>
    <use href="#spokes" x="250" y="420"/>
    <circle cx="250" cy="420" r="8" fill="#5b6268"/>
  </g>
  <g>
    <circle cx="560" cy="420" r="80" fill="none" stroke="#2b2f33" stroke-width="10"/>
    <circle cx="560" cy="420" r="73" fill="none" stroke="#c7ccd1" stroke-width="3"/>
    <use href="#spokes" x="560" y="420"/>
    <circle cx="560" cy="420" r="8" fill="#5b6268"/>
  </g>

  <!-- Frame -->
  <g stroke="#d6283a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="390" y1="430" x2="362" y2="305"/>   <!-- seat tube -->
    <line x1="365" y1="315" x2="530" y2="305"/>   <!-- top tube -->
    <line x1="390" y1="430" x2="538" y2="340"/>   <!-- down tube -->
    <line x1="390" y1="430" x2="250" y2="420"/>   <!-- chain stay -->
    <line x1="365" y1="315" x2="250" y2="420"/>   <!-- seat stay -->
    <line x1="530" y1="300" x2="540" y2="345"/>   <!-- head tube -->
    <line x1="540" y1="345" x2="560" y2="420"/>   <!-- fork -->
  </g>
  <!-- Chain ring and chain -->
  <circle cx="390" cy="430" r="20" fill="none" stroke="#3d4247" stroke-width="5"/>
  <path d="M390,410 L250,412 M390,450 L250,428" stroke="#3d4247" stroke-width="3"/>
  <!-- Seat post and saddle -->
  <line x1="362" y1="305" x2="358" y2="290" stroke="#5b6268" stroke-width="7"/>
  <path d="M330,286 Q360,278 392,288 Q370,296 330,293 Z" fill="#2b2f33"/>
  <!-- Stem and handlebar -->
  <path d="M530,302 L524,268 Q505,262 492,272" stroke="#5b6268" stroke-width="7" fill="none" stroke-linecap="round"/>
  <rect x="482" y="264" width="18" height="12" rx="5" fill="#2b2f33"/>

  <!-- Tail feathers -->
  <path d="M300,240 L248,226 L262,246 L240,256 L298,268 Z" fill="#c9d0d6" stroke="#9aa3ab" stroke-width="2"/>

  <!-- Body -->
  <ellipse cx="360" cy="245" rx="78" ry="50" fill="url(#body)" stroke="#9aa3ab" stroke-width="2" transform="rotate(-12 360 245)"/>

  <!-- Neck -->
  <path d="M400,215 C430,200 420,170 440,150 L468,160 C452,180 462,215 425,240 Z" fill="url(#body)" stroke="#9aa3ab" stroke-width="2"/>

  <!-- Pouch (lower beak) -->
  <path d="M462,170 L600,186 C575,200 545,232 505,230 C482,228 470,205 462,180 Z" fill="url(#pouch)" stroke="#c96a16" stroke-width="2"/>
  <!-- Upper beak -->
  <path d="M458,154 L610,180 L604,190 L462,172 Z" fill="#ffcc4d" stroke="#c96a16" stroke-width="2"/>
  <path d="M600,178 L614,182 L606,194 Z" fill="#e0731c"/>

  <!-- Head -->
  <circle cx="452" cy="152" r="23" fill="#ffffff" stroke="#9aa3ab" stroke-width="2"/>
  <path d="M432,140 Q425,124 438,128 Q436,116 448,124 Q452,112 458,128" fill="#fff6d6" stroke="#d8c88a" stroke-width="2"/>
  <circle cx="458" cy="148" r="5.5" fill="#1d2226"/>
  <circle cx="460" cy="146" r="1.8" fill="#ffffff"/>

  <!-- Wing reaching to handlebar -->
  <path d="M320,225 C360,205 420,215 455,245 C470,256 485,262 494,268 C478,276 455,272 430,262 C395,262 345,262 315,250 Z" fill="#b8c1c9" stroke="#7f8a94" stroke-width="2"/>
  <path d="M340,240 C370,238 400,246 425,256 M350,252 C380,250 405,256 425,262" stroke="#7f8a94" stroke-width="2" fill="none"/>
  <path d="M484,262 L500,266 L496,276 L482,274 Z" fill="#7f8a94"/>

  <!-- Near leg (in front of bike) -->
  <g stroke="#f08a2a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="380,282 438,355 420,462"/>
  </g>
  <path d="M404,466 L442,458 L436,474 Z" fill="#f08a2a" stroke="#c96a16" stroke-width="2"/>

  <!-- Cranks and pedals -->
  <line x1="390" y1="430" x2="420" y2="466" stroke="#3d4247" stroke-width="6" stroke-linecap="round"/>
  <line x1="390" y1="430" x2="362" y2="396" stroke="#3d4247" stroke-width="6" stroke-linecap="round"/>
  <rect x="408" y="463" width="26" height="7" rx="2" fill="#2b2f33"/>
  <circle cx="390" cy="430" r="6" fill="#2b2f33"/>
</svg>
