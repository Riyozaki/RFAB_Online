<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="description">A cheerful white pelican pedals a blue bicycle along a coastal road under a warm sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bd8f5"/>
      <stop offset="0.68" stop-color="#d7f3ef"/>
      <stop offset="1" stop-color="#fff3c5"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3bafd0"/>
      <stop offset="1" stop-color="#16779d"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ac3d8"/>
      <stop offset="1" stop-color="#1262a4"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd56e"/>
      <stop offset="1" stop-color="#f39a3a"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6b85b"/>
      <stop offset="1" stop-color="#dd783d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#16445a" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- coastal background -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="964" cy="119" r="63" fill="#ffe889"/>
  <circle cx="964" cy="119" r="83" fill="#ffe889" opacity="0.18" filter="url(#soft)"/>
  <g fill="#fff" opacity="0.83">
    <path d="M108 169c18-34 64-32 78 0 18-23 61-13 64 19H80c1-10 11-17 28-19z"/>
    <path d="M424 111c15-29 56-29 70-1 17-22 57-12 60 17H395c2-9 12-15 29-16z"/>
    <path d="M787 210c13-25 48-25 61-1 15-19 50-10 54 15H760c2-8 10-13 27-14z"/>
  </g>
  <path d="M0 385 C134 345 234 405 364 372S603 348 738 381s301 2 462-33v198H0z" fill="url(#sea)"/>
  <g fill="none" stroke="#b8edf0" stroke-linecap="round" opacity="0.68">
    <path d="M41 439c65-18 123-14 179 1" stroke-width="6"/>
    <path d="M302 467c52-16 117-14 169 1" stroke-width="5"/>
    <path d="M759 438c68-20 140-12 200 2" stroke-width="6"/>
    <path d="M997 477c45-13 103-11 158 2" stroke-width="5"/>
  </g>
  <path d="M0 510c156-58 282-35 416-6 147 31 251-4 380-29 155-30 262-2 404 27v298H0z" fill="#79bd72"/>
  <path d="M0 544c187-37 321 10 448 35 161 33 294-34 415-43 121-10 224 14 337 49v215H0z" fill="#4e9f63"/>
  <g fill="#397c54" opacity="0.75">
    <path d="M45 526l18-62 15 62 20-46 11 49z"/>
    <path d="M1080 561l20-73 18 73 20-44 10 47z"/>
    <path d="M1010 552l16-52 15 52 16-35 8 37z"/>
    <path d="M226 561l14-44 12 44 15-33 8 36z"/>
  </g>

  <!-- road -->
  <path d="M0 627C259 567 928 569 1200 649v151H0z" fill="#48576a"/>
  <path d="M0 645c275-57 906-54 1200 19" fill="none" stroke="#344254" stroke-width="11" opacity="0.45"/>
  <g fill="#fff5c4" opacity="0.94">
    <path d="M76 709c62-13 121-20 182-24l19 18c-68 5-125 13-178 25z"/>
    <path d="M424 676c58-4 119-5 180-2l20 17c-66-1-125 1-181 6z"/>
    <path d="M775 677c57 3 114 10 171 21l16 20c-62-12-120-20-176-24z"/>
  </g>

  <!-- bicycle shadow -->
  <ellipse cx="602" cy="704" rx="396" ry="28" fill="#263a4d" opacity="0.23" filter="url(#soft)"/>

  <!-- bicycle wheels -->
  <g fill="#f2fafb" stroke="#213747" stroke-width="15">
    <circle cx="375" cy="620" r="120"/>
    <circle cx="829" cy="620" r="120"/>
  </g>
  <g fill="none" stroke="#75a7b3" stroke-width="4" opacity="0.85">
    <circle cx="375" cy="620" r="105"/>
    <circle cx="829" cy="620" r="105"/>
    <path d="M375 500v240M255 620h240M290 535l170 170M460 535L290 705"/>
    <path d="M829 500v240M709 620h240M744 535l170 170M914 535L744 705"/>
  </g>
  <g fill="#f6c74f" stroke="#213747" stroke-width="8">
    <circle cx="375" cy="620" r="17"/>
    <circle cx="829" cy="620" r="17"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="url(#frame)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M375 620L520 445 647 620zM520 445l175 18-48 157M647 620l182-171" stroke-width="19"/>
    <path d="M520 445l-58-1M462 444l-39-12M695 463l34-50 56-18M729 413l-8-38" stroke-width="16"/>
  </g>
  <g fill="none" stroke="#233d50" stroke-linecap="round" stroke-linejoin="round">
    <path d="M408 431l51 13" stroke-width="13"/>
    <path d="M711 375h40l18-22" stroke-width="12"/>
  </g>
  <circle cx="647" cy="620" r="29" fill="#f7cd49" stroke="#213747" stroke-width="10"/>
  <path d="M647 620l-62 53M647 620l69-8" fill="none" stroke="#213747" stroke-width="10" stroke-linecap="round"/>
  <path d="M565 675h42M708 612h45" stroke="#213747" stroke-width="13" stroke-linecap="round"/>

  <!-- pelican -->
  <g filter="url(#shadow)">
    <!-- rear wing behind the body -->
    <path d="M530 369c-94 13-164 75-149 142 15 69 122 68 209 10 51-34 59-95 26-128-18-18-49-28-86-24z" fill="#bdd4d8" stroke="#2e5d69" stroke-width="10"/>
    <path d="M487 413c-46 21-72 55-68 86 43-5 91-27 130-61" fill="none" stroke="#80aab2" stroke-width="11" stroke-linecap="round"/>

    <!-- body -->
    <path d="M567 304c-84 15-136 106-119 205 11 67 68 113 145 111 91-2 159-76 155-169-3-87-61-161-132-147-15 3-31 3-49 0z" fill="#eff7f0" stroke="#2e5d69" stroke-width="11"/>
    <path d="M493 466c12 84 81 126 156 100 36-13 66-50 76-91-58 39-158 46-232-9z" fill="#d7e9e4"/>

    <!-- long neck -->
    <path d="M589 363c-61-45-66-144-17-207 39-50 95-44 113-13 16 27 6 55-25 68-20 8-25 21-19 42 7 26 29 49 62 65l-15 92c-39-16-71-28-99-47z" fill="#f4f9f2" stroke="#2e5d69" stroke-width="11" stroke-linejoin="round"/>
    <path d="M588 176c17 43 12 93-10 123" fill="none" stroke="#c3ddd5" stroke-width="11" stroke-linecap="round"/>

    <!-- head -->
    <path d="M637 141c45-11 84 12 90 49 6 42-28 69-71 66-40-3-67-27-62-61 3-24 18-47 43-54z" fill="#f4f9f2" stroke="#2e5d69" stroke-width="11"/>
    <path d="M619 166c13-28 53-37 78-18-24 3-51 14-78 18z" fill="#335b6d"/>
    <ellipse cx="673" cy="190" rx="10" ry="13" fill="#223443"/>
    <circle cx="676" cy="186" r="3.5" fill="#fff"/>

    <!-- bill and pouch -->
    <path d="M693 204c83-11 179 3 273 43-58 23-123 29-193 18l-86-14c-32-5-40-34-18-47 7-4 15-5 24-4z" fill="url(#beak)" stroke="#2e5d69" stroke-width="11" stroke-linejoin="round"/>
    <path d="M705 249l76 16c69 11 128 5 180-18-29 72-96 116-180 112-50-2-85-16-102-45-12-20-3-49 26-65z" fill="url(#pouch)" stroke="#2e5d69" stroke-width="11" stroke-linejoin="round"/>
    <path d="M729 282c63 30 142 26 202-4" fill="none" stroke="#f9cf77" stroke-width="10" stroke-linecap="round" opacity="0.7"/>

    <!-- wing on top of body -->
    <path d="M543 387c66-24 139 9 157 73 18 67-37 138-114 146-51 5-95-20-113-58 59 11 112-10 140-54 20-31 20-66 2-98-24-42-53-46-72-9z" fill="#a9cbd1" stroke="#2e5d69" stroke-width="11" stroke-linejoin="round"/>
    <path d="M511 530c55 6 105-17 126-59M529 565c61 2 116-27 139-71" fill="none" stroke="#77a6af" stroke-width="11" stroke-linecap="round"/>

    <!-- riding legs -->
    <path d="M604 592c-4 32 13 54 42 63l58 18" fill="none" stroke="#e4a64b" stroke-width="22" stroke-linecap="round"/>
    <path d="M530 591c3 38 27 61 55 82" fill="none" stroke="#e4a64b" stroke-width="22" stroke-linecap="round"/>
    <path d="M570 677h43M691 677h44" fill="none" stroke="#f6c45b" stroke-width="19" stroke-linecap="round"/>

    <!-- hand gripping handlebar -->
    <path d="M677 430c28 11 48 4 66-17l22-24" fill="none" stroke="#eef7ef" stroke-width="22" stroke-linecap="round"/>
    <path d="M759 388l18-4" fill="none" stroke="#e4a64b" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- foreground flowers -->
  <g stroke="#315e48" stroke-width="6" stroke-linecap="round">
    <path d="M105 640v-71M103 600l-25-22M105 615l27-23M1090 677v-69M1091 641l-28-23M1090 628l24-26"/>
  </g>
  <g fill="#ffdf5b" stroke="#315e48" stroke-width="4">
    <circle cx="78" cy="576" r="12"/><circle cx="132" cy="591" r="12"/><circle cx="1063" cy="616" r="12"/><circle cx="1115" cy="601" r="12"/>
  </g>
</svg>
