; RFAB Online clean-core rebuild -- 5.0.0-dev.1, NOT the final gameplay candidate.
; Only settings registered by current production code are listed here.
; Old v4.x RFAB switches were removed with those services; adding them does not enable a feature.
; Agreed target: 5s revive, 5s wipe, shared base XP + personal multipliers, enemy HP x2,
; shared secure storage, encounter reset + optional checkpoint reload. See docs/RFAB_RELEASE_STATUS.json.
[GameServer]
uPort = 10578
uMaxPlayerCount = 2
bPremiumMode = true
sServerName = RFAB Online Development
sPassword =
sAdminPassword =

[Gameplay]
uDifficulty = 2
; Experimental upstream ground-item sync remains OFF until its transfer path is verified.
bEnableItemDrops = false
bEnableMiscQuestSync = true
bEnableGreetings = false
bEnablePvp = false
; Personal houses remain separate; the future shared secure chest is an explicit storage class.
bSyncPlayerHomes = false
; Legacy upstream respawn is disabled when RFAB co-op is negotiated.
bEnableDeathSystem = false
uTimeScale = 20
bSyncPlayerCalendar = true
bAutoPartyJoin = true

[ModPolicy]
bEnableModCheck = false
bAllowSKSE = true
bAllowMO2 = true

[RFAB]
; Development-only native downed/reset path; this is not the complete candidate.
bEnableCoop = true
