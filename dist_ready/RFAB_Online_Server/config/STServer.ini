; ============================================================================
; RFAB Online - Server Configuration (Skyrim SE 1.5.97.0.8)
; ============================================================================
[GameServer]
uPort = 10578
uMaxPlayerCount = 8
bPremiumMode = true
sServerName = RFAB Online Co-Op Server
sPassword = 
sAdminPassword = 

[Gameplay]
; Difficulty: 0=Novice, 1=Apprentice, 2=Adept, 3=Expert, 4=Master (Requiem default), 5=Legendary
uDifficulty = 4
bEnableGreetings = false
bEnablePvp = false
bSyncPlayerHomes = true
bEnableDeathSystem = true
uTimeScale = 20
bSyncPlayerCalendar = true
bAutoPartyJoin = true

; Enemy HP scaling (enemy spawn count never duplicates: strictly 1x spawns!)
; Formula when bAutoScaleEnemyHealth=true and N>=2 players:
;   Multiplier = fHealthMultiplier * (PlayerCount + fHealthExtraBase)
;   Default (1.0 & 1.0): 1 player = x1 HP | 2 players = x3 HP | 3 players = x4 HP
fHealthMultiplier = 1.000000
bAutoScaleEnemyHealth = true
fHealthExtraBase = 1.000000

; 0 HP Downed-on-Knee bleedout + E-revive + strict combat leash + party wipe reload
bEnableDownedSystem = true

; Smart coordinated host saves/loads + automatic post-combat world checkpoints
bEnableCoordinatedSaves = true

[ModPolicy]
bEnableModCheck = false
bAllowSKSE = true
bAllowMO2 = true
