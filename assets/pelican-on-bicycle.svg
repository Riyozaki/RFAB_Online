    <path d="M668 356 L 684 300" stroke="#37444F" stroke-width="15"/>
    <path d="M668 356 L 684 300" stroke="url(#chrome)" stroke-width="8"/>
    <path d="M684 300 C 706 286 724 300 728 322" stroke="#37444F" stroke-width="15"/>
    <path d="M684 300 C 706 286 724 300 728 322" stroke="url(#chrome)" stroke-width="8"/>
    <path d="M726 312 L 729 330" stroke="#37444F" stroke-width="18"/>
    <path d="M726 312 L 729 330" stroke="#F4703F" stroke-width="11"/>
  </g>

  <!-- система -->
  <circle cx="515" cy="500" r="31" fill="none" stroke="#37444F" stroke-width="9" stroke-dasharray="5 7"/>
  <circle cx="515" cy="500" r="29" fill="#E8EEF1" stroke="#37444F" stroke-width="5"/>
  <circle cx="515" cy="500" r="9" fill="#C4D0D8" stroke="#37444F" stroke-width="4"/>

