<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="pelTitle pelDesc">
  <title id="pelTitle">Пеликан на велосипеде</title>
  <desc id="pelDesc">Белый пеликан в бирюзовом шлеме с большим оранжевым клювом едет на красном велосипеде по зелёному лугу в солнечный день.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6EDF5"/>
      <stop offset="0.55" stop-color="#EAF4F2"/>
      <stop offset="1" stop-color="#FCEFDA"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="0.42" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#FFEFB8"/>
      <stop offset="1" stop-color="#FFC55F"/>
    </radialGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2EAC4"/>
      <stop offset="1" stop-color="#B4D9A9"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#FFDDA2"/>
      <stop offset="0.55" stop-color="#FAB264"/>
      <stop offset="1" stop-color="#EE8A54"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0.08" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFD08F"/>
      <stop offset="0.5" stop-color="#F6A85F"/>
      <stop offset="1" stop-color="#DC6A47"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#F8FBFC"/>
      <stop offset="1" stop-color="#DFE8ED"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F1F6F8"/>
      <stop offset="1" stop-color="#DCE6EC"/>
    </linearGradient>
    <linearGradient id="helmetGrad" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#45C0AE"/>
      <stop offset="1" stop-color="#1E7F74"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F4703F"/>
      <stop offset="1" stop-color="#D24428"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F1F5F7"/>
      <stop offset="0.5" stop-color="#CDD7DD"/>
      <stop offset="1" stop-color="#AEBDC5"/>
    </linearGradient>

    <!-- колесо: радиус покрышки 112 -->
    <g id="wheel">
      <circle r="112" fill="none" stroke="#37444F" stroke-width="17"/>
      <circle r="112" fill="none" stroke="#5B6C78" stroke-width="4.5" stroke-dasharray="15 23" opacity="0.6"/>
      <circle r="120.5" fill="none" stroke="#37444F" stroke-width="4"/>
      <circle r="103.5" fill="none" stroke="#37444F" stroke-width="4"/>
      <circle r="95" fill="none" stroke="#E8EEF1" stroke-width="11"/>
      <g stroke="#C4D0D8" stroke-width="3.2" stroke-linecap="round">
        <path d="M0 -91 V 91 M-91 0 H 91 M-64.4 -64.4 L 64.4 64.4 M64.4 -64.4 L -64.4 64.4 M-87 -36 L 87 36 M-87 36 L 87 -36"/>
      </g>
      <circle r="15" fill="#EDF1F3" stroke="#37444F" stroke-width="5"/>
      <circle r="5" fill="#37444F"/>
    </g>

    <!-- рама -->
    <g id="frame" fill="none">
      <path d="M430 352 L 515 500"/>
      <path d="M430 352 L 668 356"/>
      <path d="M515 500 L 682 442"/>
      <path d="M668 356 L 688 436"/>
      <path d="M688 436 Q 704 472 712 505"/>
      <path d="M515 500 L 330 505"/>
      <path d="M430 352 L 330 505"/>
    </g>
  </defs>

