  <circle cx="612" cy="146" r="52" fill="#FCFDFD" stroke="#37444F" stroke-width="5.5"/>

  <!-- глаз -->
  <g>
    <circle cx="630" cy="124" r="15" fill="#FFFFFF" stroke="#37444F" stroke-width="4.5"/>
    <circle cx="634" cy="126" r="7.8" fill="#2C3A45"/>
    <circle cx="637" cy="122.5" r="2.8" fill="#FFFFFF"/>
