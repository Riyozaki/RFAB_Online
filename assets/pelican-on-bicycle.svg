  <path d="M548 628 C 656 528 838 518 1010 606 L 1010 628 Z" fill="#BDE0C6"/>
  <path d="M104 628 C 246 570 438 570 566 628 Z" fill="#DCF0DE"/>

  <!-- земля -->
