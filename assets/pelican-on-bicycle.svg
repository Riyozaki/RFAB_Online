  <path d="M670 128 C 732 132 800 144 848 156" fill="none" stroke="#FFE8C4" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M864 166 C 860 172 852 174 846 172" fill="none" stroke="#C9603F" stroke-width="3.5" stroke-linecap="round"/>

